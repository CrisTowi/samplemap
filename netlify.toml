[build]
  command = "pnpm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/genius-api/*"
  to = "https://api.genius.com/:splat"
  status = 200
  force = true
  headers = {X-Forwarded-For = ""}

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
